<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker</title>
  <link rel="stylesheet" href="./css/main.css">
  <!-- Opcional: Iconos de Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

  <div class="c_contenedor_app">
    <!-- Barra de búsqueda superior -->
    <div class="c_barra_busqueda">
      <button class="c_boton_menu" id="btn_menu_principal">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="c_entrada_busqueda_wrapper">
        <span class="material-symbols-outlined c_icono_busqueda">search</span>
        <input type="text" id="entrada_buscar_anime" class="c_entrada_busqueda" placeholder="Buscar un anime..." value="">
      </div>
      <div class="c_botones_cabecera">
        <button class="c_boton_guardar" id="btn_guardar_datos">
          <span class="material-symbols-outlined">save</span>
        </button>
        <button class="c_boton_carpeta" id="btn_abrir_carpetas">
          <span class="material-symbols-outlined">folder</span>
        </button>
        <div class="c_configuracion_wrapper">
          <button class="c_boton_configuracion" id="btn_alternar_configuracion">
            <span class="material-symbols-outlined">settings</span>
          </button>
          <div class="c_menu_configuracion oculto" id="menu_configuracion">
            <div class="c_menu_items">
              <a href="#" class="c_item_menu" role="menuitem" id="opcion_menu_exportar">Exportar</a>
              <a href="#" class="c_item_menu" role="menuitem" id="opcion_menu_importar">Importar</a>
              <a href="#" class="c_item_menu" role="menuitem" id="opcion_menu_opciones">Opciones</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Portada -->
    <div class="c_portada_container" id="contenedor_portada">
      <div class="c_capa_fondo" id="capa_fondo_portada"></div>
      <div class="c_imagen_principal_wrapper">
        <img id="imagen_portada_principal" class="c_imagen_principal"
          src="  https://lh3.googleusercontent.com/-tGHmZ6GF0cc/WpohCECY6kI/AAAAAAABdDI/fdZBbrmha_A9gOQ9wp-qKgThLFr1rUq0QCHMYCw/s0/ef3ba899fa0c572bebb18586d81b151c2d72f2bf.jpg  "
          alt="Portada del anime">
      </div>
    </div>

    <!-- Información principal -->
    <div class="c_info_principal_flex contenedor_flex">
      <div class="c_titulo_id_wrapper_flex contenedor_flex">
        <h1 id="texto_nombre_anime" class="c_titulo_anime">Anime Genérico</h1>
        <div class="c_id_container_flex contenedor_flex">
          <p class="c_etiqueta_id">ID: <span id="texto_id_anime">anime-generico</span></p>
          <span class="material-symbols-outlined c_icono_copiar" id="btn_copiar_id" title="Copiar ID">content_copy</span>
        </div>
      </div>

      <div class="contenedor_flex">
        <!-- Favorito -->
        <div class="c_favorito_container_flex contenedor_flex">
          <span class="c_etiqueta_fav">Favorite</span>
          <label class="c_switch_favorito">
            <input type="checkbox" id="entrada_es_favorito">
            <span class="c_slider_favorito"></span>
          </label>
        </div>
        <!-- Calificación y Seguimiento -->
        <div class="c_calificacion_container_flex contenedor_flex">
          <p class="c_etiqueta_calificacion">Rating</p>
          <div class="c_rating_controls_flex contenedor_flex">
            <span class="material-symbols-outlined c_estrella">star</span>
            <span class="c_valor_calificacion" id="texto_nota_usuario">5</span>
            <button class="c_boton_calificacion" id="btn_restar_calificacion">-</button>
            <button class="c_boton_calificacion" id="btn_sumar_calificacion">+</button>
          </div>
        </div>
        <!-- Visualización -->
        <div class="c_estado_container">
          <select id="selector_estado_seguimiento" class="c_selector_estado">
            <option value="ver">Ver</option>
            <option value="viendo" selected>Viendo</option>
            <option value="visto">Visto</option>
            <option value="abandonado">Abandonado</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Temporada/Episodio y Botón -->
    <div class="c_progreso_wrapper_flex contenedor_flex">
      <div class="c_temporada_episodio_controls_flex contenedor_flex">
        <div class="c_grupo_T_E_flex contenedor_flex">
          <p class="c_etiqueta_T_E">T</p> <!-- Temporada -->
          <div class="c_numero_control_flex contenedor_flex">
            <button class="c_boton_numero" id="btn_restar_temporada">-</button>
            <input type="number" id="entrada_temporada_actual" class="c_entrada_numero" value="1" min="1">
            <button class="c_boton_numero" id="btn_sumar_temporada">+</button>
          </div>
        </div>
        <div class="c_grupo_T_E_flex contenedor_flex">
          <p class="c_etiqueta_T_E">E</p> <!-- Episodio -->
          <div class="c_numero_control_flex contenedor_flex">
            <button class="c_boton_numero" id="btn_restar_episodio">-</button>
            <input type="number" id="entrada_episodio_actual" class="c_entrada_numero" value="0" min="1">
            <button class="c_boton_numero" id="btn_sumar_episodio">+</button>
          </div>
        </div>
      </div>
      <button id="btn_marcar_episodio_visto" class="c_boton_visto">Capitulo Visto</button>
    </div>

    <!-- Audio y Subtítulos -->
    <div class="c_audio_subtitulos_section_flex contenedor_flex">
      <p class="c_seccion_label">Audio & Subtitles</p>
      <div class="c_audio_subtitulos_controls_flex contenedor_flex">
        <select id="selector_idioma_audio" class="c_selector_audio">
          <option value="es">🇪🇸 Español</option>
          <option value="jp">🇯🇵 Japonés</option>
          <option value="en">🇺🇸 Inglés</option>
          <option value="kr">🇰🇷 Coreano</option>
          <option value="cn">🇨🇳 Chino</option>
          <option value="tr">🇹🇷 Turco</option>
        </select>
        <select id="selector_idioma_subtitulos" class="c_selector_subtitulos">
          <option value="-">🚫 No</option>
          <option value="es">🇪🇸 Español</option>
          <option value="jp">🇯🇵 Japonés</option>
          <option value="en">🇺🇸 Inglés</option>
          <option value="kr">🇰🇷 Coreano</option>
          <option value="cn">🇨🇳 Chino</option>
          <option value="tr">🇹🇷 Turco</option>
        </select>
      </div>
    </div>

    <!-- Estreno y Emisión -->
    <div class="c_cuadricula_estreno_emision">
      <div class="c_elemento_cuadricula_flex contenedor_flex">
        <p class="c_etiqueta_cuadricula">Temporada de Estreno</p>
        <select id="selector_temporada_estreno" class="c_selector_temporada">
          <option value="">-</option>
          <option value="primavera">🌸 Primavera</option>
          <option value="verano">☀️ Verano</option>
          <option value="otoño">🍂 Otoño</option>
          <option value="invierno">❄️ Invierno</option>
        </select>
      </div>
      <div class="c_elemento_cuadricula_flex contenedor_flex">
        <p class="c_etiqueta_cuadricula">Año de Estreno</p>
        <input type="number" id="entrada_anyo_estreno" class="c_entrada_anyo" placeholder="Año" min="1900" max="2100">
      </div>
    </div>

    <!-- Día de estreno y Estado de emisión -->
    <div class="c_cuadricula">
      <div class="c_elemento_cuadricula_flex contenedor_flex">
        <p class="c_etiqueta_cuadricula">Día de Estreno</p>
        <select id="selector_dia_emision" class="c_selector_dia">
          <option value="">-</option>
          <option value="lunes">lunes</option>
          <option value="martes">martes</option>
          <option value="miercoles">miércoles</option>
          <option value="jueves">jueves</option>
          <option value="viernes">viernes</option>
          <option value="sabado">sábado</option>
          <option value="domingo">domingo</option>
        </select>
      </div>
      <div class="c_elemento_cuadricula_flex contenedor_flex">
        <p class="c_etiqueta_cuadricula">Estado de Emisión</p>
        <select id="selector_estado_general_anime" class="c_selector_estado_emision">
          <option value="desconocido">? Desconocido</option>
          <option value="emisión">Emisión</option>
          <option value="finalizado">Finalizado</option>
          <option value="cancelada">Cancelada</option>
          <option value="peli-ova">Película/Ova</option>
        </select>
      </div>
    </div>

    <!-- Géneros -->
    <div class="c_seccion_generos_flex contenedor_flex">
      <div class="c_cabecera_seccion_flex contenedor_flex">
        <p class="c_etiqueta_seccion">Genres</p>
        <button id="btn_editar_generos" class="c_boton_editar">Edit Genres</button>
      </div>
      <p id="texto_lista_generos" class="c_lista_generos">Action, Dark Fantasy, Post-Apocalyptic</p>
      <input type="text" id="entrada_edicion_generos" class="c_entrada_generos" value="Action, Dark Fantasy, Post-Apocalyptic" style="display: none;">
    </div>

    <!-- Relacionado con -->
    <div class="c_seccion_relacionado_flex contenedor_flex">
      <p class="c_etiqueta_seccion">Relacionado con</p>
      <div class="c_controles_relacionado_flex contenedor_flex">
        <input type="text" id="entrada_buscar_anime_relacionado" class="c_entrada_relacionado" placeholder="Buscar anime relacionado">
        <select id="selector_tipo_relacion" class="c_selector_relacion">
          <option value="secuela" selected>Secuela</option>
          <option value="precuela">Precuela</option>
          <option value="alternativa">Versión Alternativa</option>
          <option value="paralela">Historia Paralela</option>
        </select>
      </div>
    </div>

    <!-- Botón final -->
    <button id="btn_guardar_final" class="c_boton_guardar_final">Save to Folders</button>
  </div>

  <script type="module" src="popup_script.js"></script>
</body>
</html>
